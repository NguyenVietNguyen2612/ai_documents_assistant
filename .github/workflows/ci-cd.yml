name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "feature/**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # PHẦN 1: KIỂM THỬ BACKEND (CI)
  # ==========================================
  test-backend:
    name: Backend Tests & Test Scorecard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Start Database Services (Milvus Standalone + etcd + MinIO)
        run: |
          docker compose up -d standalone
          # Đợi tối đa 30 giây để Milvus khởi động và sẵn sàng nhận kết nối
          timeout 30 bash -c 'until curl -s http://localhost:9091/healthz > /dev/null; do sleep 2; done' || sleep 10

      - name: Run Automated Test Suite (32 Tests across 7 Modules)
        env:
          HF_HUB_OFFLINE: "1"
          MILVUS_URI: "http://localhost:19530"
        run: |
          cd backend
          python auto_tests/run_all_tests.py

  # ==========================================
  # PHẦN 2: XÁC MINH FRONTEND BUILD (CI)
  # ==========================================
  test-frontend:
    name: Frontend Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install dependencies & Build Vite Bundle
        run: |
          cd frontend
          npm install
          npm run build

  # ==========================================
  # PHẦN 3: ĐÓNG GÓI & PHÂN PHỐI DOCKER (CD)
  # ==========================================
  build-and-push:
    name: Build & Push Docker Images
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'NguyenVietNguyen2612'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: env.DOCKER_USERNAME != ''
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        if: env.DOCKER_USERNAME != ''
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ai-documents-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        if: env.DOCKER_USERNAME != ''
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ai-documents-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
