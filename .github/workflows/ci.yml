name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # PHẦN CI: KIỂM TRA (INTEGRATION)
  # ==========================================
  test-backend:
    name: Run Backend Tests (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12' # Đã cập nhật lên 3.12 để hỗ trợ numpy mới nhất

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run Pytest
        run: |
          cd backend
          pytest auto_tests/

  # ==========================================
  # PHẦN CD: ĐÓNG GÓI VÀ PHÂN PHỐI (DELIVERY)
  # ==========================================
  build-and-push:
    name: Build & Push Images (CD)
    needs: test-backend # BẮT BUỘC job CI phải pass thì job CD mới được chạy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ai-documents-backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ai-documents-frontend:latest
